<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meme preview</title>
<style>
:root{--bg:#111318;--card:#1c1f27;--fg:#eceef3;--mut:#8b91a1;--acc:#6aa8ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;padding:16px}
h1,h2{margin:.4em 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card.up{outline:2px solid #3fb950}.card.down{outline:2px solid #f85149}
.n{font-weight:600;word-break:break-word}.m{color:var(--mut);font-size:14px}
a{color:var(--acc)}
audio,video,canvas{width:100%;border-radius:8px;background:#000}
canvas{display:none;background:repeating-conic-gradient(#888 0 25%,#ccc 0 50%) 0 0/20px 20px}
.row{display:flex;gap:8px}
button,select{min-height:48px;font-size:18px;border-radius:10px;border:1px solid #333;background:#2a2e3a;color:var(--fg);padding:0 14px}
.row button{flex:1}
button.on{background:var(--acc);color:#000}
select{flex:2}
label{min-height:44px;display:flex;align-items:center;gap:8px}
input[type=checkbox]{width:24px;height:24px}
textarea{width:100%;height:200px;background:#0b0d11;color:var(--fg);border:1px solid #333;border-radius:8px;margin-top:8px}
#exp{min-height:52px;width:100%;margin:16px 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.bar button{min-height:40px;font-size:15px}.bar button.on{background:var(--acc);color:#000}
#q{min-height:40px;font-size:16px;border-radius:10px;border:1px solid #333;background:#2a2e3a;color:var(--fg);padding:0 12px;flex:1;min-width:160px}
.sg{display:inline-block;font-size:12px;background:#2a2e3a;border-radius:6px;padding:1px 6px;margin-left:6px;color:var(--mut)}
.vf{aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vf video,.vf canvas{width:100%;height:100%;object-fit:contain;border-radius:0}
.ctl{display:flex;gap:8px;align-items:center}.ctl button{min-height:36px;font-size:16px;padding:0 12px}.ctl input{flex:1}
[hidden]{display:none!important}
</style></head><body>
